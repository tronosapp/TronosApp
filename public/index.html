                        col4 = `
                            <div class="text-[9px] font-black uppercase text-slate-400 mb-1">Horario Entrega</div>
                            <div class="bg-blue-100 text-blue-800 font-black text-sm px-3 py-2 rounded-xl text-center shadow-inner w-full mb-2">${item.h_e || 'N/A'} - ${item.h_e_m || 'N/A'}</div>
                            <div class="text-[9px] font-black uppercase text-slate-400 mb-1 mt-1 border-t border-slate-200 pt-2 w-full text-center">Retiro Prog.</div>
                            <div class="bg-red-50 text-red-600 font-bold text-[10px] px-2 py-1.5 rounded-lg text-center shadow-inner w-full border border-red-100">${fRetiroDate}<br>${item.h_r || 'N/A'} - ${item.h_r_m || 'N/A'}</div>
                        `;
                    } else if(item._routeType === 'RETIRO DE EVENTO') {
                        col4 = `
                            <div class="text-[9px] font-black uppercase text-slate-400 mb-1">Rango de Retiro</div>
                            <div class="bg-red-100 text-red-800 font-black text-sm px-3 py-2 rounded-xl text-center shadow-inner">${item._routeTime || 'N/A'} - ${item._routeTimeMax || 'N/A'}</div>
                        `;
                    } else if(item._routeType === 'LIMPIEZA DE EVENTO') {
                        col4 = `
                            <div class="text-[9px] font-black uppercase text-slate-400 mb-1">Horario Limpieza</div>
                            <div class="bg-cyan-100 text-cyan-800 font-black text-sm px-3 py-2 rounded-xl text-center shadow-inner"><i data-lucide="droplets" class="w-4 h-4 inline"></i> ${item._routeTime || 'N/A'}</div>
                        `;
                    } else if(item.type === 'ENTREGAS DE OBRA' || item.type === 'MOVIMIENTO') {
                        col4 = `
                            <div class="text-[9px] font-black uppercase text-slate-400 mb-1">Obra / Operador</div>
                            <div class="bg-amber-100 text-amber-800 font-black text-xs uppercase px-3 py-2 rounded-xl text-center shadow-inner border border-amber-200 w-full"><i data-lucide="hard-hat" class="w-4 h-4 inline mb-0.5"></i><br>${(item.obra || 'S/N').toUpperCase()}</div>
                        `;
                    } else if(item.type === 'RETIROS DE OBRA') {
                        let motivoDesc = item.motivo === 'TO' ? 'Término de Obra' : item.motivo === 'SUSP' ? 'Suspendido' : item.motivo === 'MP' ? 'Mal Pago' : item.motivo;
                        col4 = `
                            <div class="text-[9px] font-black uppercase text-slate-400 mb-1">Motivo de Retiro</div>
                            <div class="bg-rose-100 text-rose-800 font-black text-xs uppercase px-3 py-2 rounded-xl text-center shadow-inner border border-rose-200 w-full">${motivoDesc || 'N/A'}</div>
                            ${item.obra ? `<div class="text-[9px] font-bold uppercase text-slate-500 mt-2 text-center w-full">OBRA: ${item.obra.toUpperCase()}</div>` : ''}
                        `;
                    }

                    html += `
                        <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-stretch section-separator pb-6 mb-6">
                            <div class="md:col-span-2 bg-white/50 p-2 rounded-xl"><div class="md:hidden text-[9px] font-black uppercase text-slate-400 mb-1">FECHA / DATOS</div>${col1}</div>
                            <div class="md:col-span-3 bg-white/50 p-2 rounded-xl border-l border-slate-100 overflow-hidden min-w-0"><div class="md:hidden text-[9px] font-black uppercase text-slate-400 mb-1">CLIENTE / CONTACTOS</div>${col2}</div>
                            <div class="md:col-span-5 bg-white/50 p-2 rounded-xl border-l border-slate-100 overflow-hidden min-w-0"><div class="md:hidden text-[9px] font-black uppercase text-slate-400 mb-1">DIRECCIONES Y PRODUCTOS</div>${col3}</div>
                            <div class="md:col-span-2 bg-slate-50/50 p-3 rounded-xl border-2 border-slate-100 flex flex-col justify-center items-center">${col4}</div>
                        </div>
                    `;
                });
                html += `</div></div>`; 
            });
            
            cont.innerHTML = html;
            lucide.createIcons({root: cont});
        }

        // ---------- EXPORTACIÓN A PDF DE HOJA DE RUTA ----------
        function exportRoutePDF() {
            const targetDate = document.getElementById('route_date').value;
            if(!targetDate) return showToast("Seleccione una fecha");
            const statusFilter = state.routeStatus || 'PENDIENTES';

            let activities = [];
            let expandedDB = getExpandedDatabase();

            expandedDB.forEach(item => {
                if (item.type === 'EVENTO') {
                    let isEntComp = item.chk_entrega || false;
                    let showEnt = (statusFilter === 'TODOS') || (statusFilter === 'PENDIENTES' && !isEntComp) || (statusFilter === 'COMPLETADOS' && isEntComp);

                    if (item.fecha === targetDate && showEnt) {
                        activities.push({ ...item, _routeType: 'ENTREGA DE EVENTO', _actionCompleted: isEntComp });
                    }

                    let isRetComp = item.chk_retiro || false;
                    let showRet = (statusFilter === 'TODOS') || (statusFilter === 'PENDIENTES' && !isRetComp) || (statusFilter === 'COMPLETADOS' && isRetComp);
                    
                    if (item.f_r === targetDate && showRet) {
                        activities.push({ ...item, _routeType: 'RETIRO DE EVENTO', _routeTime: item.h_r, _routeTimeMax: item.h_r_m, _actionCompleted: isRetComp });
                    }

                    let isLimComp = item.chk_limpieza || false;
                    let showLim = (statusFilter === 'TODOS') || (statusFilter === 'PENDIENTES' && !isLimComp) || (statusFilter === 'COMPLETADOS' && isLimComp);

                    if (item._ref.limpiezas && showLim) {
                        item._ref.limpiezas.forEach(l => {
                            if(l.fecha === targetDate) { activities.push({ ...item, _routeType: 'LIMPIEZA DE EVENTO', _routeTime: l.hora, _actionCompleted: isLimComp }); }
                        });
                    }
                } else {
                    let isComp = item.status === 'COMPLETADO' || item.status === 'LISTO';
                    if (statusFilter === 'PENDIENTES' && isComp) return;
                    if (statusFilter === 'COMPLETADOS' && !isComp) return;

                    if(item.fecha === targetDate) {
                        if(item.type === 'ENTREGAS DE OBRA') activities.push({ ...item, _routeType: 'ENTREGA DE OBRA' });
                        else if(item.type === 'RETIROS DE OBRA') activities.push({ ...item, _routeType: 'RETIRO DE OBRA' });
                        else if(item.type === 'MOVIMIENTO') activities.push({ ...item, _routeType: 'MOVIMIENTO' });
                    }
                }
            });

            activities.sort((a, b) => {
                const order = { 'ENTREGA DE EVENTO':1, 'ENTREGA DE OBRA':2, 'RETIRO DE OBRA':3, 'RETIRO DE EVENTO':3, 'MOVIMIENTO':4, 'LIMPIEZA DE EVENTO':4 };
                let diff = (order[a._routeType]||5) - (order[b._routeType]||5);
                if(diff !== 0) return diff;
                
                if(a._routeType === 'ENTREGA DE EVENTO') return (a.h_e || '23:59').localeCompare(b.h_e || '23:59');
                if(a._routeType === 'ENTREGA DE OBRA') return (a.obra || 'ZZZ').localeCompare(b.obra || 'ZZZ');
                return 0;
            });

            if(activities.length === 0) return showToast("No hay datos para PDF");

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'pt', 'letter');
            
            doc.setFont("helvetica", "bold");
            doc.setFontSize(18);
            doc.text("TRONOS - HOJA DE RUTA DIARIA", 40, 40);
            doc.setFontSize(10);
            doc.setTextColor(100);
            const dateStr = new Date(targetDate).toLocaleDateString('es-ES', {timeZone:'UTC', weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'}).toUpperCase();
            doc.text(`FECHA: ${dateStr} - FILTRO: ${statusFilter.toUpperCase()}`, 40, 55);
            doc.setTextColor(0);

            const tableData = activities.map(item => {
                let fDate = item.fecha;
                if (fDate && fDate.includes('-')) {
                    const parts = fDate.split('-');
                    if(parts.length === 3) fDate = `${parts[2]}/${parts[1]}/${parts[0]}`;
                }

                let vendorLabel = item.type === 'RETIROS DE OBRA' ? 'Reg:' : 'Vend:';
                let col1 = `${fDate}\nPago: ${item.pago}\n${item.vendedor && item.vendedor !== 'N/A' ? vendorLabel + ' ' + item.vendedor : ''}`;
                if(item.cot) col1 += `\nCot: ${item.cot}`;
             if (item.type === 'MOVIMIENTO') {
    let movTipo = (item.tipo_mov || 'MOVIMIENTO').toUpperCase();
    let movHora = item.h_mov || item.hora || item._routeTime || '';
    col1 += `\n[${movTipo}${movHora ? ' - ' + movHora : ''}]`;
} else {
    col1 += `\n[${item._routeType}]`;
}
                
                let isActComp = item._actionCompleted !== undefined ? item._actionCompleted : (item.status === 'COMPLETADO' || item.status === 'LISTO');
                let mainContact = item.contacto;
                if (item.type === 'ENTREGAS DE OBRA' && isActComp && item.cont_contrata) {
                    mainContact = item.cont_contrata;
                }

                let contactos = mainContact;
                if(item.productos) {
                    const cSet = new Set();
                    item.productos.forEach(p => { if(p.n_cont && p.n_cont.toUpperCase() !== mainContact.toUpperCase()) cSet.add(p.n_cont.toUpperCase()); });
                    cSet.forEach(c => { contactos += `\nSitio: ${c}`; });
                }
                let col2 = `${item.cliente}\nTel: ${contactos}`;

                let col3 = '';
                let isMov = item.type === 'MOVIMIENTO';
                
                if(isMov) col3 += `[ORIGEN]\n`;
                col3 += `DIRECCIÓN: ${item.direccion}\n`;
                if(item.ubicacion) col3 += `${item.ubicacion}\n`;
                
                if(item.productos && item.productos.length > 0) {
                    col3 += `> ${item.productos.map(p=>{
                        let symText = '';
                        if(p.sym) symText = item.type === 'EVENTO' ? ' (+Lámpara)' : ' (+Candado)';
                        return `${p.cant}x ${p.modelo}${symText}`;
                    }).join(', ')}\n`;
                }

                let col4 = '';
                if(item._routeType === 'ENTREGA DE EVENTO') {
                    let fRetiro = item.f_r;
                    if (fRetiro && fRetiro.includes('-')) {
                        const parts = fRetiro.split('-');
                        if(parts.length === 3) fRetiro = `${parts[2]}/${parts[1]}/${parts[0]}`;
                    }
                    col4 = `ENTREGA:\n${item.h_e || 'N/A'} - ${item.h_e_m || 'N/A'}\n\nRETIRO: ${fRetiro || 'S/F'}\n${item.h_r || 'N/A'} - ${item.h_r_m || 'N/A'}`;
                }
                else if(item._routeType === 'RETIRO DE EVENTO') col4 = `RETIRO:\n${item._routeTime || 'N/A'} - ${item._routeTimeMax || 'N/A'}`;
                else if(item._routeType === 'LIMPIEZA DE EVENTO') col4 = `LIMPIEZA:\n${item._routeTime || 'N/A'}`;
                else if(item.type === 'ENTREGAS DE OBRA' || item.type === 'MOVIMIENTO') {
                    col4 = `OBRA:\n${(item.obra || 'S/N').toUpperCase()}`;
                }
                else if(item.type === 'RETIROS DE OBRA') {
                    col4 = `MOTIVO:\n${item.motivo}\nObra: ${(item.obra||'S/N').toUpperCase()}`;
                }

                        const row = [col1.trim(), col2.trim(), col3.trim(), col4]; row._routeType = item._routeType || item.type; return row;
            });

            doc.autoTable({
                startY: 70,
                margin: { left: 20, right: 20 },
                head: [['FECHA / DATOS', 'CLIENTE / CONTACTO', 'DIRECCIONES Y PRODUCTOS', 'DETALLE / HORARIO']],
                body: tableData,
                styles: { 
                    fontSize: 8.5, 
                    font: 'helvetica', 
                    cellPadding: 3, 
                    overflow: 'linebreak',
                    lineColor: [0, 0, 0], 
                    lineWidth: 1
                },
                headStyles: { 
                    fillColor: [255, 255, 255], 
                    textColor: [0, 0, 0], 
                    fontStyle: 'normal', 
                    halign: 'center' 
                },
                bodyStyles: { 
                    fillColor: [255, 255, 255], 
                    textColor: [0, 0, 0],
                    valign: 'middle' 
                },
                alternateRowStyles: { 
                    fillColor: [255, 255, 255] 
                },
                columnStyles: { 
                    0: { cellWidth: 90, halign: 'left' },
                    1: { cellWidth: 120, halign: 'left' },
                    2: { cellWidth: 'auto', halign: 'left' }, 
                    3: { cellWidth: 100, halign: 'left' }
                },
                theme: 'grid',
                        didParseCell: function(data) {
                                    if (data.section === 'body') {
                                                    var tipo = data.row.raw._routeType;
                                                                    var colorMap = {
                                                                                        'ENTREGA DE EVENTO': [255, 255, 255],
                                                                                                            'ENTREGA DE OBRA':   [213, 230, 255],
                                                                                                                                'RETIRO DE EVENTO':  [209, 240, 220],
                                                                                                                                                    'RETIRO DE OBRA':    [255, 230, 210],
                                                                                                                                                                        'LIMPIEZA DE EVENTO': [240, 230, 255],
                                                                                                                                                                                            'MOVIMIENTO':        [255, 248, 210]
                                                                                                                                                                                                            };
                                                                                                                                                                                                                            var color = colorMap[tipo];
                                                                                                                                                                                                                                            if (color) { data.cell.styles.fillColor = color; }
                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                },
                    didDrawRow: function(data) {
                        if (data.row.section === 'body') {
                            const allRows = data.table.body;
                            const nextRow = allRows[data.row.index + 1];
                            if (nextRow && nextRow.raw._routeType !== data.row.raw._routeType) {
                                const x1 = data.settings.margin.left;
                                const x2 = data.table.width + data.settings.margin.left;
                                const y = data.cursor.y;
                                data.doc.setDrawColor(0, 0, 0);
                                data.doc.setLineWidth(0.8);
                                data.doc.line(x1, y, x2, y);
                                data.doc.line(x1, y + 1.5, x2, y + 1.5);
                            }
                        }
                    },
                willDrawCell: function(data) {
                    if (data.row.section === 'body' && (data.column.index === 1 || data.column.index === 2)) {
                        if (!data.cell.customLines) {
                            data.cell.customLines = [...data.cell.text];
                            data.cell.text = data.cell.customLines.map(() => '');
                        }
                    }
                },
                didDrawCell: function(data) {
                    if (data.row.section === 'body' && data.cell.customLines) {
                        let fontSize = data.cell.styles.fontSize || 8.5;
                        doc.setFontSize(fontSize);
                        doc.setFont(data.cell.styles.font || 'helvetica', data.cell.styles.fontStyle || 'normal');
                        let lineSpacing = fontSize * (doc.internal.getLineHeightFactor ? doc.internal.getLineHeightFactor() : 1.15); 
                        
                        let totalTextHeight = data.cell.customLines.length * lineSpacing;
                        let startY = data.cell.y + (data.cell.height - totalTextHeight) / 2; 

                        if (data.column.index === 1) {
                            data.cell.customLines.forEach((line, i) => {
                                let textY = startY + (i * lineSpacing) + (fontSize * 0.85); 
                                let rectY = startY + (i * lineSpacing); 
                                
                                let isPhoneLine = line.trim().startsWith('Tel:') || line.trim().startsWith('Sitio:');
                                let currentLink = "";
                                
                                if (isPhoneLine) {
                                    let digits = line.replace(/\D/g, ''); 
                                    if (digits.length >= 7) {
                                        if (digits.length === 10 && !digits.startsWith("52")) digits = "52" + digits;
                                        currentLink = `https://wa.me/${digits}`;
                                    }
                                }

                                if (currentLink) {
                                    doc.setTextColor(37, 99, 235);
                                } else {
                                    doc.setTextColor(0, 0, 0);
                                }

                                let printText = line.trimRight();
                                if(printText.length > 0) {
                                    doc.text(printText, data.cell.x + data.cell.padding('left'), textY);
                                    
                                    if (currentLink) {
                                        let textWidth = doc.getTextWidth(printText);
                                        doc.setDrawColor(37, 99, 235);
                                        doc.setLineWidth(0.5);
                                        doc.line(data.cell.x + data.cell.padding('left'), textY + 1.5, data.cell.x + data.cell.padding('left') + textWidth, textY + 1.5);
                                        doc.link(data.cell.x + data.cell.padding('left'), rectY, textWidth, lineSpacing, { url: currentLink });
                                    }
                                }
                            });
                            doc.setTextColor(0, 0, 0); 
                        } 
                        else if (data.column.index === 2) {
                            let queries = [];
                            let activeUrl = "";
                            
                            data.cell.customLines.forEach(line => {
                                let trimmed = line.trim();
                                if (trimmed.startsWith('http://') || trimmed.startsWith('https://')) {
                                    activeUrl = trimmed;
                                    queries.push(activeUrl);
                                } else if (trimmed.startsWith('>') || trimmed.startsWith('[') || trimmed.startsWith('DIRECCIÓN:')) {
                                    activeUrl = "";
                                    queries.push("");
                                } else if (activeUrl) {
                                    activeUrl += trimmed;
                                    for(let j = queries.length - 1; j >= 0; j--) {
                                        if(queries[j] === "") break;
                                        queries[j] = activeUrl;
                                    }
                                    queries.push(activeUrl);
                                } else {
                                    queries.push("");
                                }
                            });

                            let isProductBlock = false;

                            data.cell.customLines.forEach((line, i) => {
                                let textY = startY + (i * lineSpacing) + (fontSize * 0.85); 
                                let rectY = startY + (i * lineSpacing); 
                                let fullUrl = queries[i];
                                let isCurrentLink = fullUrl !== "";

                                let printText = line.trimRight();
                                let trimmedPrint = printText.trim();

                                if (trimmedPrint.startsWith('>')) {
                                    isProductBlock = true;
                                } else if (trimmedPrint === '' || trimmedPrint.startsWith('DIRECCIÓN:') || trimmedPrint.startsWith('[') || trimmedPrint.startsWith('OBRA:') || trimmedPrint.startsWith('http')) {
                                    isProductBlock = false;
                                }

                                if (isProductBlock) {
                                    doc.setFont("helvetica", "bold");
                                } else {
                                    doc.setFont(data.cell.styles.font || 'helvetica', data.cell.styles.fontStyle || 'normal');
                                }

                                if (isCurrentLink) {
                                    doc.setTextColor(37, 99, 235);
                                } else {
                                    doc.setTextColor(0, 0, 0);
                                }

                                if(printText.length > 0) {
                                    doc.text(printText, data.cell.x + data.cell.padding('left'), textY);
                                    
                                    if (isCurrentLink) {
                                        let textWidth = doc.getTextWidth(printText);
                                        doc.setDrawColor(37, 99, 235);
                                        doc.setLineWidth(0.5);
                                        doc.line(data.cell.x + data.cell.padding('left'), textY + 1.5, data.cell.x + data.cell.padding('left') + textWidth, textY + 1.5);
                                        doc.link(data.cell.x + data.cell.padding('left'), rectY, textWidth, lineSpacing, { url: fullUrl });
                                    }
                                }
                            });
                            doc.setTextColor(0, 0, 0); 
                        }
                    }
                }
            });

            // --- SUMATORIAS DINAMICAS AL FINAL DEL PDF ---
            let entregasStats = {};
            let retirosStats = {};

            activities.forEach(item => {
                if (item.type === 'ENTREGAS DE OBRA') {
                    (item.productos || []).forEach(p => {
                        let m = p.modelo.toUpperCase();
                        entregasStats[m] = (entregasStats[m] || 0) + (parseInt(p.cant) || 0);
                    });
                }
                if (item.type === 'RETIROS DE OBRA') {
                    (item.productos || []).forEach(p => {
                        let m = p.modelo.toUpperCase();
                        retirosStats[m] = (retirosStats[m] || 0) + (parseInt(p.cant) || 0);
                    });
                }
            });

            let entStr = Object.keys(entregasStats).length > 0 
                ? Object.entries(entregasStats).map(([mod, cant]) => `${cant} ${mod}`).join(', ') 
                : '0 ESTANDAR';
                
            let retStr = Object.keys(retirosStats).length > 0 
                ? Object.entries(retirosStats).map(([mod, cant]) => `${cant} ${mod}`).join(', ') 
                : '0 ESTANDAR';

            let finalY = (doc.lastAutoTable ? doc.lastAutoTable.finalY : doc.autoTable.previous.finalY) + 30;
            
            if (finalY > 730) {
                doc.addPage();
                finalY = 40;
            }

            doc.setFontSize(11);
            doc.setFont("helvetica", "bold");
            doc.setTextColor(0, 0, 0);
            doc.text(`-ENTREGA DE OBRA: ${entStr}`, 40, finalY);
            doc.text(`-RETIRO DE OBRA: ${retStr}`, 40, finalY + 15);

            doc.save(`Ruta_Tronos_${targetDate}.pdf`);
            showToast("PDF GENERADO CON ÉXITO");
        }

        // ---------- NUEVO: GENERADOR DE NOTA DE SALIDA INDIVIDUAL ----------
        function generateNotaSalidaPDF(id, subDirEnc) {
            const item = state.database.find(x => x.id === id);
            if(!item) return;

            let cliente = item.cliente || '';
            let fechaStr = item.fecha ? new Date(item.fecha).toLocaleDateString('es-ES', {timeZone:'UTC'}) : '';
            let direccion = '';
            let prods = [];

            if (subDirEnc) {
                let subDir = decodeURIComponent(subDirEnc);
                direccion = subDir;
                prods = (item.productos || []).filter(p => p.n_dir === subDir);
            } else {
                direccion = item.direccion || '';
                prods = (item.productos || []).filter(p => !p.n_dir);
            }

            let descItems = prods.map(p => `${p.cant} SANITARIO PORTATIL MODELO ${p.modelo}`).join(', ');
            let descripcion = `RENTA DE ${descItems}`;

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'pt', 'letter');
            
            const margin = 40;
            const maxW = 612 - (margin * 2); 
            let yPos = 40;

            // --- CABECERA ---
            doc.setFont("helvetica", "bold");
            doc.setFontSize(10);
            doc.text("TRONOS RENTA DE BAÑOS PORTÁTILES", margin, yPos);
            
            yPos += 20;
            doc.setFontSize(15);
            doc.text("NOTA DE SALIDA POR RENTA (ORDEN DE ENTREGA)", 612/2, yPos, { align: "center" });
            
            yPos += 20;
            doc.setFontSize(12);
            doc.text("SERSA DEL SURESTE SA DE CV", 612/2, yPos, { align: "center" });

        function updateDash() {
            const date = document.getElementById('df_date').value;
            const tipo = document.getElementById('df_tipo').value;
            const cliente = document.getElementById('df_cliente').value.toUpperCase();
            const obra = document.getElementById('df_obra').value.toUpperCase();
            const mod = document.getElementById('df_mod').value;
            const cant = document.getElementById('df_cant').value;
            const vend = document.getElementById('df_vend').value;
            const pago = document.getElementById('df_pago').value;
            const stat = document.getElementById('df_stat').value;

            let expandedDB = getExpandedDatabase();

            window.filteredDashData = expandedDB.filter(item => {
                let match = true;
                if(date && !(item.fecha||'').includes(date)) match = false;
                if(tipo && item.type !== tipo) match = false;
                if(cliente && !(item.cliente||'').includes(cliente)) match = false;
                if(obra && !(item.obra||'').toUpperCase().includes(obra)) match = false;
                if(vend && (item.vendedor||'N/A') !== vend) match = false;
                if(pago && item.pago !== pago) match = false;
                if(stat && item.status !== stat) match = false;

                if(mod || cant) {
                    let prodMatch = false;
                    if(item.productos) {
                        prodMatch = item.productos.some(p => {
                            let mMod = mod ? p.modelo === mod : true;
                            let mCant = cant ? parseInt(p.cant) === parseInt(cant) : true;
                            return mMod && mCant;
                        });
                    }
                    if(!prodMatch) match = false;
                }
                return match;
            });

            window.filteredDashData.sort((a,b) => new Date(a.fecha||0) - new Date(b.fecha||0));

            const tbody = document.getElementById('dash_body');
            const tfoot = document.getElementById('dash_footer');
            
            if(window.filteredDashData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="p-16 text-center text-slate-400 font-black uppercase text-xs italic tracking-widest">No hay registros que coincidan con los filtros aplicados</td></tr>';
                tfoot.innerHTML = '';
                return;
            }

            let sumTipo = 0, sumCliente = 0, sumObra = 0, sumProds = 0, sumPago = 0, sumVend = 0, sumStat = 0;

            tbody.innerHTML = window.filteredDashData.map(item => {
                sumTipo += item.type ? 1 : 0;
                sumCliente += item.cliente ? 1 : 0;
                sumObra += item.obra ? 1 : 0;
                sumPago += item.pago ? 1 : 0;
                sumVend += (item.vendedor && item.vendedor !== 'N/A') ? 1 : 0;
                sumStat += item.status ? 1 : 0;

                let prodsHTML = '<span class="text-[10px] text-slate-400 italic font-bold uppercase">Sin productos</span>';
                
                if(item.productos && item.productos.length > 0) {
                    let itemTotal = item.productos.reduce((s, p) => {
                        if (mod && p.modelo !== mod) return s;
                        return s + parseInt(p.cant||0);
                    }, 0);
                    sumProds += itemTotal;
                    
                    let prodsToShow = mod ? item.productos.filter(p => p.modelo === mod) : item.productos;
                    prodsHTML = prodsToShow.map(p => `<span class="bg-white text-slate-700 px-2 py-1 rounded-md border border-slate-200 inline-block m-0.5 shadow-sm font-black text-[9px] uppercase">${p.cant}x ${p.modelo}</span>`).join('');
                }

                let subIndicator = item._isSub ? `<span class="bg-amber-100 text-amber-700 px-2 py-0.5 rounded text-[8px] uppercase border border-amber-200 shadow-sm ml-2">Adicional</span>` : '';

                let obraCotText = (item.obra || '-').toUpperCase();
                if (item.type === 'EVENTO' && item.cot) {
                    obraCotText = item.obra ? `${item.obra.toUpperCase()}<br>COT: ${item.cot}` : `COT: ${item.cot}`;
                }

                return `
                    <tr class="hover:bg-slate-50 transition-colors group">
                        <td class="p-4 align-middle font-bold text-slate-800 whitespace-nowrap">${item.fecha || 'S/F'}</td>
                        <td class="p-4 align-middle text-[9px] font-bold text-slate-500 uppercase tracking-widest">${item.type}</td>
                        <td class="p-4 align-middle">
                            <div class="max-w-xs break-words whitespace-normal font-black text-slate-900 leading-tight">
                                ${item.cliente} ${subIndicator}
                            </div>
                        </td>
                        <td class="p-4 align-middle">
                            <div class="max-w-xs break-words whitespace-normal text-xs text-slate-600 font-medium">
                                ${item.direccion || '-'}
                            </div>
                        </td>
                        <td class="p-4 align-middle text-[10px] font-bold text-amber-700 max-w-[150px] whitespace-normal break-words">${obraCotText}</td>
                        <td class="p-4 align-middle leading-relaxed max-w-[250px] whitespace-normal">${prodsHTML}</td>
                        <td class="p-4 align-middle font-bold text-slate-800 text-[10px]"><i data-lucide="dollar-sign" class="w-3 h-3 text-emerald-500 inline"></i> ${item.pago}</td>
                        <td class="p-4 align-middle text-[10px] text-slate-500 uppercase font-bold"><i data-lucide="user" class="w-3 h-3 inline"></i> ${item.vendedor||'N/A'}</td>
                        <td class="p-4 align-middle text-center"><span class="px-2 py-1 rounded-lg text-[8px] font-black uppercase tracking-widest inline-block shadow-sm border ${item.status === 'COMPLETADO' || item.status === 'LISTO' ? 'bg-emerald-50 text-emerald-600 border-emerald-200' : 'bg-amber-50 text-amber-600 border-amber-200'}">${item.status}</span></td>
                    </tr>
                `;
            }).join('');

            tfoot.innerHTML = `
                <tr>
                    <td class="p-4 text-slate-400">TOTALES</td>
                    <td class="p-4 text-blue-600">${sumTipo} Regs</td>
                    <td class="p-4 text-blue-600">${sumCliente} Regs</td>
                    <td class="p-4 text-blue-600">-</td>
                    <td class="p-4 text-blue-600">${sumObra} Regs</td>
                    <td class="p-4 text-emerald-600 font-[900] text-sm">${sumProds} UNIDS</td>
                    <td class="p-4 text-blue-600">${sumPago} Regs</td>
                    <td class="p-4 text-blue-600">${sumVend} Regs</td>
                    <td class="p-4 text-blue-600 text-center">${sumStat} Regs</td>
                </tr>
            `;
            
            lucide.createIcons({root: tbody});
        }

        function exportExcel() {
            const dataToExport = window.filteredDashData && window.filteredDashData.length > 0 
                                 ? window.filteredDashData 
                                 : getExpandedDatabase();
            
            if(dataToExport.length === 0) return showToast("No hay datos para exportar");

            const modFilter = document.getElementById('df_mod')?.value || '';
            const wsData = dataToExport.map(item => {
                const totalUnits = item.productos ? item.productos.reduce((s, p) => {
                    if (modFilter && p.modelo !== modFilter) return s;
                    return s + parseInt(p.cant||0);
                }, 0) : 0;
                
                let prodsToShow = item.productos || [];
                if (modFilter) prodsToShow = prodsToShow.filter(p => p.modelo === modFilter);
                let prodDesc = prodsToShow.map(p => p.modelo).join(', ');

                let obraCotExport = item.obra ? item.obra.toUpperCase() : '';
                if (item.type === 'EVENTO' && item.cot) {
                    obraCotExport = item.obra ? `${item.obra.toUpperCase()} - COT: ${item.cot}` : `COT: ${item.cot}`;
                }

                let isActComp = item.status === 'COMPLETADO' || item.status === 'LISTO';
                let contactExport = item.contacto;
                if (item.type === 'ENTREGAS DE OBRA' && isActComp && item.cont_contrata) {
                    contactExport = item.cont_contrata;
                }

                return {
                    "ID ORIGEN": item.id,
                    "ES ADICIONAL": item._isSub ? "SÍ" : "NO",
                    "ESTADO": item.status,
                    "TIPO": item.type,
                    "FECHA SERVICIO": item.fecha,
                    "CLIENTE": item.cliente,
                    "CONTACTO": contactExport,
                    "OBRA / OPERADOR / COT": obraCotExport,
                    "DIRECCIÓN": item.direccion,
                    "PAGO": item.pago,
                    "VENDEDOR": item.vendedor,
                    "TOTAL UNIDADES": totalUnits,
                    "MODELO": prodDesc,
                    "MOTIVO (Retiros)": item.motivo,
                    "TIPO MOV": item.tipo_mov,
                    "MAPS": item.ubicacion,
                    "FECHA REGISTRO": new Date(item.id).toLocaleDateString('es-ES')
                };
            });

            const ws = XLSX.utils.json_to_sheet(wsData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "BaseDeDatos_Filtrada");
            
            const dateStr = new Date().toISOString().split('T')[0];
            XLSX.writeFile(wb, `TRONOS_Export_Filtrado_${dateStr}.xlsx`);
            showToast("EXCEL GENERADO CON ÉXITO");
        }

        function generateStatsReport() {
            const monthSelect = document.getElementById('report_months');
            const selectedOptions = Array.from(monthSelect.selectedOptions);
            
            if (selectedOptions.length === 0) return showToast("Selecciona al menos un mes");
            
            const selectedMonths = selectedOptions.map(opt => opt.value);
            const selectedMonthNames = selectedOptions.map(opt => opt.text);
            const year = document.getElementById('report_year').value;
            const resultsDiv = document.getElementById('report_results');
            
            const expandedDB = getExpandedDatabase();

            const filteredData = expandedDB.filter(item => {
                const isCompletado = item.status === 'COMPLETADO' || item.status === 'LISTO';
                if (!isCompletado || !item.fecha) return false;
                const [y, m] = item.fecha.split('-');
                return y === year && selectedMonths.includes(m);
            });

            const eventosStats = { 'ESTANDAR': 0, 'QUEEN': 0, 'FLUSH': 0, 'INCLUYENTE': 0, 'LAVAMANOS': 0 };
            let totalEventos = 0;
            let monthTotalsEventos = {};

            let totalEntregasObra = 0;
            let monthTotalsEntregas = {};

            const retirosStats = {};
            let totalRetiros = 0;
            let monthTotalsRetiros = {};

            selectedMonths.forEach(m => {
                monthTotalsEventos[m] = 0;
                monthTotalsEntregas[m] = 0;
                monthTotalsRetiros[m] = 0;
            });

            filteredData.forEach(item => {
                const type = item.type.toUpperCase();
                const m = item.fecha.split('-')[1];
                
                if (type === 'EVENTO') {
                    if (item.productos) {
                        item.productos.forEach(p => {
                            const model = p.modelo.toUpperCase();
                            const cant = parseInt(p.cant) || 0;
                            if (eventosStats.hasOwnProperty(model)) {
                                eventosStats[model] += cant;
                                totalEventos += cant;
                                monthTotalsEventos[m] += cant;
                            }
                        });
                    }
                } else if (type === 'ENTREGAS DE OBRA') {
                    if (item.productos) {
                        item.productos.forEach(p => {
                            let cant = parseInt(p.cant) || 0;
                            totalEntregasObra += cant;
                            monthTotalsEntregas[m] += cant;
                        });
                    }
                } else if (type === 'RETIROS DE OBRA') {
                    const motivo = (item.motivo || 'SIN MOTIVO').toUpperCase();
                    let cantRetiro = 0;
                    if (item.productos) {
                        item.productos.forEach(p => cantRetiro += (parseInt(p.cant) || 0));
                    }
                    retirosStats[motivo] = (retirosStats[motivo] || 0) + cantRetiro;
                    totalRetiros += cantRetiro;
                    monthTotalsRetiros[m] += cantRetiro;
                }
            });

            window.lastStatsReport = {
                months: selectedMonths,
                monthNames: selectedMonthNames,
                year: year,
                totalEventos, monthTotalsEventos, eventosStats,
                totalEntregasObra, monthTotalsEntregas,
                totalRetiros, monthTotalsRetiros, retirosStats
            };

            function generateBreakdownHTML(totalsDict) {
                if (selectedMonths.length <= 1) return '';
                let prev = null;
                let items = selectedMonths.map((m, i) => {
                    let val = totalsDict[m] || 0;
                    let difHTML = '';
                    if (prev !== null) {
                        let diff = val - prev;
                        let color = diff > 0 ? 'text-emerald-500' : (diff < 0 ? 'text-red-500' : 'text-slate-400');
                        let sign = diff > 0 ? '+' : '';
                        difHTML = `<span class="${color} ml-1 font-black">(${sign}${diff})</span>`;
                    }
                    prev = val;
                    return `<div class="flex justify-between items-center text-[10px] font-bold text-slate-600 border-b border-slate-100 last:border-0 py-1.5"><span>${selectedMonthNames[i]}</span> <span>${val} ${difHTML}</span></div>`;
                }).join('');
                return `<div class="mt-4 pt-4 border-t border-slate-200 w-full"><div class="text-[9px] font-black uppercase text-slate-400 mb-2 tracking-widest text-center">Evolución / Diferencia</div>${items}</div>`;
            }

            resultsDiv.innerHTML = `
                <div class="bg-slate-50 border-2 border-slate-100 rounded-[2rem] p-6 animate-in slide-in-from-bottom-4 flex flex-col">
                    <h3 class="text-blue-600 font-black text-sm mb-6 border-b-2 border-blue-100 pb-3 flex items-center gap-2 uppercase tracking-tighter">
                        <i data-lucide="star" class="w-5 h-5"></i> EVENTOS
                    </h3>
                    <div class="space-y-4 mb-4">
                        ${Object.entries(eventosStats).map(([mod, cant]) => `
                            <div class="flex justify-between items-center text-[11px] font-black uppercase text-slate-500">
                                <span class="bg-white px-3 py-1 rounded-lg border border-slate-200 shadow-sm">${mod}</span>
                                <span class="text-slate-900 text-sm">${cant}</span>
                            </div>
                        `).join('')}
                    </div>
                    ${generateBreakdownHTML(monthTotalsEventos)}
                    <div class="bg-blue-600 text-white p-4 rounded-2xl flex justify-between items-center shadow-xl shadow-blue-100 mt-auto">
                        <span class="text-[9px] font-black uppercase tracking-widest">Cantidad Total</span>
                        <span class="text-2xl font-black">${totalEventos}</span>
                    </div>
                </div>

                <div class="bg-slate-50 border-2 border-slate-100 rounded-[2rem] p-6 animate-in slide-in-from-bottom-4 delay-75 flex flex-col">
                    <h3 class="text-emerald-600 font-black text-sm mb-6 border-b-2 border-emerald-100 pb-3 flex items-center gap-2 uppercase tracking-tighter">
                        <i data-lucide="truck" class="w-5 h-5"></i> ENTREGAS OBRA
                    </h3>
                    <div class="flex-grow flex flex-col justify-center items-center py-6">
                        <span class="text-slate-400 text-[10px] font-black uppercase tracking-[0.2em] mb-2">Total Programado</span>
                        <span class="text-6xl font-[900] text-slate-900 tracking-tighter">${totalEntregasObra}</span>
                    </div>
                    ${generateBreakdownHTML(monthTotalsEntregas)}
                    <div class="bg-emerald-600 text-white p-4 rounded-2xl flex justify-between items-center shadow-xl shadow-emerald-100 mt-4">
                        <span class="text-[9px] font-black uppercase tracking-widest">Cantidad Total</span>
                        <span class="text-2xl font-black">${totalEntregasObra}</span>
                    </div>
                </div>

                <div class="bg-slate-50 border-2 border-slate-100 rounded-[2rem] p-6 animate-in slide-in-from-bottom-4 delay-150 flex flex-col">
                    <h3 class="text-red-600 font-black text-sm mb-6 border-b-2 border-red-100 pb-3 flex items-center gap-2 uppercase tracking-tighter">
                        <i data-lucide="package-minus" class="w-5 h-5"></i> RETIROS OBRA
                    </h3>
                    <div class="mb-4 text-[9px] font-black text-slate-400 uppercase tracking-widest px-2">Desglose por Motivos</div>
                    <div class="space-y-4 mb-4 flex-grow">
                        ${Object.entries(retirosStats).length > 0 
                            ? Object.entries(retirosStats).map(([mot, cant]) => `
                                <div class="flex justify-between items-center text-[11px] font-black uppercase text-slate-500">
                                    <span class="bg-white px-3 py-1 rounded-lg border border-slate-200 shadow-sm max-w-[70%] truncate">${mot}</span>
                                    <span class="text-slate-900 text-sm">${cant}</span>
                                </div>`).join('')
                            : '<div class="text-center text-slate-300 text-[10px] font-black uppercase py-10 italic">No hay retiros registrados</div>'
                        }
                    </div>
                    ${generateBreakdownHTML(monthTotalsRetiros)}
                    <div class="bg-red-600 text-white p-4 rounded-2xl flex justify-between items-center shadow-xl shadow-red-100 mt-auto">
                        <span class="text-[9px] font-black uppercase tracking-widest">Cantidad Total</span>
                        <span class="text-2xl font-black">${totalRetiros}</span>
                    </div>
                </div>
            `;
            lucide.createIcons();
            showToast(`Reporte Generado: ${selectedMonthNames.join(', ')} / ${year}`);
        }

        function downloadStatsPDF() {
            if (!window.lastStatsReport) return showToast("Primero genera las sumatorias en pantalla");
            
            const data = window.lastStatsReport;
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'pt', 'letter');
            
            doc.setFont("helvetica", "bold");
            doc.setFontSize(16);
            doc.text("REPORTE ESTADÍSTICO DE OPERACIONES - TRONOS", 40, 40);
            
            doc.setFontSize(10);
            doc.setTextColor(100);
            doc.text(`PERIODO: ${data.monthNames.join(', ')} ${data.year}`, 40, 55);
            doc.setTextColor(0);
            
            let yPos = 80;

            const drawSection = (title, total, breakdown, breakdownLabel, stats) => {
                if (yPos > 680) {
                    doc.addPage();
                    yPos = 50;
                }
                
                doc.setFontSize(12);
                doc.setFont("helvetica", "bold");
                doc.text(title, 40, yPos);
                yPos += 15;
                
                doc.setFontSize(10);
                doc.setFont("helvetica", "normal");
                doc.text(`Total Acumulado: ${total}`, 40, yPos);
                yPos += 20;

                if (stats && Object.keys(stats).length > 0) {
                    let hasData = false;
                    Object.values(stats).forEach(v => { if (v > 0) hasData = true; });
                    
                    if (hasData) {
                        doc.setFontSize(9);
                        doc.setFont("helvetica", "bold");
                        doc.text(breakdownLabel, 40, yPos);
                        yPos += 12;
                        doc.setFont("helvetica", "normal");
                        Object.entries(stats).forEach(([k, v]) => {
                            if (v > 0) {
                                doc.text(`- ${k}: ${v}`, 50, yPos);
                                yPos += 12;
                            }
                        });
                        yPos += 5;
                    }
                }

                if (data.months.length > 1) {
                    doc.setFontSize(9);
                    doc.setFont("helvetica", "bold");
                    doc.text("Desglose Mensual (Diferencia):", 40, yPos);
                    yPos += 12;
                    doc.setFont("helvetica", "normal");
                    
                    let prev = null;
                    data.months.forEach((m, idx) => {
                        let val = breakdown[m] || 0;
                        let difStr = "";
                        if (prev !== null) {
                            let diff = val - prev;
                            let sign = diff >= 0 ? '+' : '';
                            difStr = `   (${sign}${diff})`;
                        }
                        doc.text(`- ${data.monthNames[idx]}: ${val}${difStr}`, 50, yPos);
                        yPos += 12;
                        prev = val;
                    });
                    yPos += 5;
                }
                
                doc.setDrawColor(200, 200, 200);
                doc.setLineWidth(0.5);
                doc.line(40, yPos, 572, yPos);
                yPos += 20;
            };

            drawSection("EVENTOS", data.totalEventos, data.monthTotalsEventos, "Por Modelo:", data.eventosStats);
            drawSection("ENTREGAS DE OBRA", data.totalEntregasObra, data.monthTotalsEntregas, "", null);
            drawSection("RETIROS DE OBRA", data.totalRetiros, data.monthTotalsRetiros, "Por Motivo:", data.retirosStats);

            doc.save(`Estadisticas_${data.year}.pdf`);
            showToast("PDF ESTADÍSTICO DESCARGADO");
        }

        window.onload = function() {
            render();
        };
    </script>
    <!-- Integración con Base de Datos MySQL -->
    <script src="db_adapter.js?v=2.2"></script>
</body>
