<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRONOS - Gestión de Programación</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .input-trono { @apply w-full p-3 border-2 border-slate-200 rounded-xl focus:ring-4 focus:ring-blue-100 focus:border-blue-500 outline-none uppercase transition-all bg-white font-semibold text-sm; }
        .input-lowercase { text-transform: none !important; }
        .label-trono { @apply block text-[10px] font-black text-slate-500 mb-1.5 uppercase tracking-widest; }
        .btn-primary { @apply bg-slate-900 text-white px-6 py-3 rounded-2xl font-bold text-xs uppercase tracking-widest hover:bg-black transition-all active:scale-95 shadow-lg; }
        .btn-secondary { @apply bg-white text-slate-900 border-2 border-slate-200 px-6 py-3 rounded-2xl font-bold text-xs uppercase hover:bg-slate-50 transition-all; }
        .section-separator { border-bottom: 3px solid #000 !important; }
        
        #toast { visibility: hidden; min-width: 300px; background-color: #0f172a; color: #fff; text-align: center; border-radius: 20px; padding: 20px; position: fixed; z-index: 1000; left: 50%; bottom: 40px; transform: translateX(-50%); font-weight: 800; text-transform: uppercase; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 40px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 40px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>
    <div id="root"></div>
    <div id="toast"></div>

    <script>
        const VENDORS = ['M', 'D', 'J', 'OTRO'];
        const REGISTRO_OPTS = ['M', 'F', 'A', 'D', 'O'];
        const MODELS = ['ESTANDAR', 'QUEEN', 'FLUSH', 'INCLUYENTE', 'LAVAMANOS'];
        const PAYMENTS = ['Efectivo', 'Fiscal', 'Efectivo-PO', 'Fiscal-PO'];
        const MOV_TYPES = ['Limpieza', 'Movimiento', 'Cambio de Sanitario', 'Portacandado', 'Otro'];

        let state = {
            view: 'login',
            user: null,
            database: JSON.parse(localStorage.getItem('tronos_db_v4')) || [],
            preprogrammed: JSON.parse(localStorage.getItem('tronos_pre_v4')) || [],
            folders: JSON.parse(localStorage.getItem('tronos_folders_v4')) || [],
            currentFolder: null,
            selectedRows: [],
            filters: { date: '', client: '', status: 'PENDIENTES' },
            editingId: null,
            convertData: null,
            routeStatus: 'PENDIENTES'
        };

        window.filteredDashData = [];

        function saveState() {
            localStorage.setItem('tronos_db_v4', JSON.stringify(state.database));
            localStorage.setItem('tronos_pre_v4', JSON.stringify(state.preprogrammed));
            localStorage.setItem('tronos_folders_v4', JSON.stringify(state.folders));
        }

        function showToast(msg) {
            const t = document.getElementById("toast");
            t.innerText = msg; t.className = "show";
            setTimeout(() => { t.className = ""; }, 3000);
        }

        function showConfirm(message, onConfirm) {
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[2000] flex items-center justify-center animate-in fade-in duration-200';
            modal.innerHTML = `
                <div class="bg-white p-6 rounded-3xl shadow-2xl max-w-sm w-full mx-4 text-center transform scale-100 animate-in zoom-in-95 duration-200">
                    <div class="w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i data-lucide="alert-triangle" class="w-8 h-8"></i>
                    </div>
                    <h3 class="font-black text-lg text-slate-900 uppercase tracking-tighter mb-2">Confirmar Acción</h3>
                    <p class="text-sm text-slate-500 font-medium mb-6">${message}</p>
                    <div class="flex gap-3">
                        <button id="btn-cancel-modal" class="flex-1 bg-slate-100 text-slate-700 py-3 rounded-xl font-bold text-xs uppercase hover:bg-slate-200 transition-all">Cancelar</button>
                        <button id="btn-confirm-modal" class="flex-1 bg-red-500 text-white py-3 rounded-xl font-bold text-xs uppercase hover:bg-red-600 transition-all shadow-lg shadow-red-200">Confirmar</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            lucide.createIcons({root: modal});

            document.getElementById('btn-cancel-modal').onclick = () => modal.remove();
            document.getElementById('btn-confirm-modal').onclick = () => {
                onConfirm();
                modal.remove();
            };
        }

        function showInputModal(title, message, defaultValue, onConfirm) {
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[2000] flex items-center justify-center animate-in fade-in duration-200';
            modal.innerHTML = `
                <div class="bg-white p-6 rounded-3xl shadow-2xl max-w-sm w-full mx-4 transform scale-100 animate-in zoom-in-95 duration-200">
                    <h3 class="font-black text-lg text-slate-900 uppercase tracking-tighter mb-2 text-center">${title}</h3>
                    <p class="text-xs text-slate-500 font-bold mb-4 text-center uppercase">${message}</p>
                    <input type="text" id="modal_input_val" class="input-trono mb-6" value="${defaultValue}">
                    <div class="flex gap-3">
                        <button id="btn-cancel-in" class="flex-1 bg-slate-100 text-slate-700 py-3 rounded-xl font-bold text-xs uppercase hover:bg-slate-200 transition-all">Cancelar</button>
                        <button id="btn-confirm-in" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold text-xs uppercase hover:bg-blue-700 transition-all shadow-lg shadow-blue-200">Guardar</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            const input = document.getElementById('modal_input_val');
            input.focus();
            document.getElementById('btn-cancel-in').onclick = () => modal.remove();
            document.getElementById('btn-confirm-in').onclick = () => {
                const val = input.value.trim().toUpperCase();
                if(val) onConfirm(val);
                modal.remove();
            };
        }

        // --- EXPANSOR VIRTUAL UNIVERSAL (Aplica a todas las categorías) ---
        function getExpandedDatabase() {
            let expandedData = [];
            state.database.forEach(item => {
                let mainProds = [];
                let extraLocs = {};
                (item.productos || []).forEach(p => {
                    if (p.n_dir) {
                        if (!extraLocs[p.n_dir]) extraLocs[p.n_dir] = { prods: [], firstProd: p };
                        extraLocs[p.n_dir].prods.push(p);
                    } else {
                        mainProds.push(p);
                    }
                });

                // Fila Principal
                if (mainProds.length > 0 || Object.keys(extraLocs).length === 0) {
                    expandedData.push({
                        ...item,
                        _ref: item,
                        _isSub: false,
                        _subDir: null,
                        _folderId: item.folderId || null,
                        productos: mainProds.length > 0 ? mainProds : item.productos
                    });
                }

                // Filas Adicionales
                for (const [dir, data] of Object.entries(extraLocs)) {
                    if (!item.extra_status) item.extra_status = {};
                    
                    let subItem = {
                        ...item,
                        _ref: item,
                        _isSub: true,
                        _subDir: dir,
                        _folderId: (item.extra_folderId && item.extra_folderId[dir]) ? item.extra_folderId[dir] : null,
                        obra: data.firstProd.n_obra || item.obra,
                        contacto: data.firstProd.n_cont || item.contacto,
                        direccion: dir,
                        ubicacion: data.firstProd.n_ubi || item.ubicacion,
                        status: item.extra_status[dir] || 'PENDIENTE',
                        productos: data.prods
                    };

                    // Extraer checks de Hitos si el adicional pertenece a un EVENTO
                    if (item.type === 'EVENTO') {
                        if (!item.extra_chk_entrega) item.extra_chk_entrega = {};
                        if (!item.extra_chk_limpieza) item.extra_chk_limpieza = {};
                        if (!item.extra_chk_retiro) item.extra_chk_retiro = {};
                        
                        subItem.chk_entrega = item.extra_chk_entrega[dir] || false;
                        subItem.chk_limpieza = item.extra_chk_limpieza[dir] || false;
                        subItem.chk_retiro = item.extra_chk_retiro[dir] || false;
                    }

                    expandedData.push(subItem);
                }
            });
            return expandedData;
        }

        function render() {
            const root = document.getElementById('root');
            root.innerHTML = '';

            if (state.view === 'login') return renderLogin(root);

            const container = document.createElement('div');
            container.className = 'max-w-7xl mx-auto p-4 md:p-8 min-h-screen animate-in fade-in duration-300';

            const header = document.createElement('div');
            header.className = 'flex flex-col md:flex-row justify-between items-center mb-8 bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100 gap-4';
            header.innerHTML = `
                <div class="text-center md:text-left">
                    <h1 class="text-3xl font-[900] tracking-tighter text-slate-900 leading-none">TRONOS</h1>
                    <p class="text-[9px] font-black text-blue-500 uppercase tracking-widest mt-1">Gestión de Logística</p>
                </div>
                <div class="flex items-center gap-3">
                    ${state.view !== 'dashboard' ? `
                        <button onclick="goToMenu()" class="btn-primary flex items-center gap-2 py-2 px-4 text-[10px]">
                            <i data-lucide="layout-grid" class="w-4 h-4"></i> INICIO
                        </button>
                    ` : ''}
                    <button onclick="logout()" class="p-3 bg-red-50 text-red-500 rounded-xl hover:bg-red-500 hover:text-white transition-all shadow-sm" title="Cerrar Sesión">
                        <i data-lucide="log-out" class="w-5 h-5"></i>
                    </button>
                </div>
            `;
            container.appendChild(header);

            const content = document.createElement('div');
            content.className = 'w-full';
            container.appendChild(content);
            root.appendChild(container);

            switch(state.view) {
                case 'dashboard': renderDashboard(content); break;
                case 'preprogramar': renderPreprogramar(content); break;
                case 'programar': renderProgramar(content); break;
                case 'programacion_fecha': renderProgramacionFecha(content); break;
                case 'reportes': renderReportes(content); break;
                case 'base_datos': renderBaseDatos(content); break;
            }

            lucide.createIcons();
        }

        function renderLogin(root) {
            root.innerHTML = `
                <div class="min-h-screen flex items-center justify-center p-6 bg-slate-900 animate-in zoom-in duration-500">
                    <div class="bg-white p-10 rounded-[3rem] shadow-2xl w-full max-w-md text-center border-4 border-slate-800 relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-full h-2 bg-blue-500"></div>
                        <h1 class="text-5xl font-[900] tracking-tighter mb-2 text-slate-900">TRONOS</h1>
                        <p class="text-slate-400 font-bold text-[10px] uppercase tracking-[0.3em] mb-10">Portal de Administración</p>
                        <div class="space-y-6 text-left relative z-10">
                            <div><label class="label-trono">Usuario</label><input type="text" id="login_user" class="input-trono text-center text-lg shadow-inner" value="TRONOS"></div>
                            <div><label class="label-trono">Contraseña</label><input type="password" id="login_pass" class="input-trono text-center text-lg shadow-inner" onkeydown="if(event.key==='Enter') doLogin()"></div>
                            <button onclick="doLogin()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black uppercase tracking-widest hover:bg-blue-700 transition-all shadow-xl shadow-blue-200 mt-4 active:scale-95">Ingresar al Sistema</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function doLogin() {
            const u = document.getElementById('login_user').value;
            const p = document.getElementById('login_pass').value;
            if (u === 'TRONOS' && p === 'RENTA') { state.user = 'TRONOS'; state.view = 'dashboard'; render(); }
            else { showToast("Credenciales Incorrectas"); }
        }

        function logout() { state.user = null; state.view = 'login'; render(); }
        function goToMenu() { state.editingId = null; state.convertData = null; state.view = 'dashboard'; render(); }

        function renderDashboard(content) {
            const preCount = state.preprogrammed.length;
            const expandedDB = getExpandedDatabase();
            const pendingCount = expandedDB.filter(x => x.status !== 'COMPLETADO' && x.status !== 'LISTO').length;
            
            content.innerHTML = `
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
                    <button onclick="state.view='preprogramar'; render()" class="bg-white p-6 md:p-8 rounded-[2.5rem] shadow-sm hover:shadow-xl hover:-translate-y-2 transition-all border border-slate-100 text-center group relative overflow-hidden">
                        <div class="absolute -right-4 -top-4 w-24 h-24 bg-amber-50 rounded-full opacity-50 group-hover:scale-150 transition-transform duration-500"></div>
                        <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-2xl flex items-center justify-center mx-auto mb-6 group-hover:bg-amber-500 group-hover:text-white transition-colors relative z-10 shadow-inner">
                            <i data-lucide="clock" class="w-8 h-8"></i>
                        </div>
                        <h3 class="font-black text-slate-900 uppercase tracking-tighter text-lg md:text-xl relative z-10">Preprogramar</h3>
                        <p class="text-[10px] text-slate-400 font-bold mt-2 uppercase relative z-10">En espera: <span class="text-amber-500">${preCount}</span></p>
                    </button>
                    
                    <button onclick="state.view='programar'; render()" class="bg-white p-6 md:p-8 rounded-[2.5rem] shadow-sm hover:shadow-xl hover:-translate-y-2 transition-all border border-slate-100 text-center group relative overflow-hidden">
                        <div class="absolute -right-4 -top-4 w-24 h-24 bg-blue-50 rounded-full opacity-50 group-hover:scale-150 transition-transform duration-500"></div>
                        <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-6 group-hover:bg-blue-600 group-hover:text-white transition-colors relative z-10 shadow-inner">
                            <i data-lucide="calendar-plus" class="w-8 h-8"></i>
                        </div>
                        <h3 class="font-black text-slate-900 uppercase tracking-tighter text-lg md:text-xl relative z-10">Programar</h3>
                        <p class="text-[10px] text-slate-400 font-bold mt-2 uppercase relative z-10">Crear Servicio</p>
                    </button>
                    
                    <button onclick="state.view='programacion_fecha'; render()" class="bg-white p-6 md:p-8 rounded-[2.5rem] shadow-sm hover:shadow-xl hover:-translate-y-2 transition-all border border-slate-100 text-center group relative overflow-hidden">
                        <div class="absolute -right-4 -top-4 w-24 h-24 bg-emerald-50 rounded-full opacity-50 group-hover:scale-150 transition-transform duration-500"></div>
                        <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-2xl flex items-center justify-center mx-auto mb-6 group-hover:bg-emerald-500 group-hover:text-white transition-colors relative z-10 shadow-inner">
                            <i data-lucide="truck" class="w-8 h-8"></i>
                        </div>
                        <h3 class="font-black text-slate-900 uppercase tracking-tighter text-lg md:text-xl relative z-10">Logística</h3>
                        <p class="text-[10px] text-slate-400 font-bold mt-2 uppercase relative z-10">Rutas Diarias</p>
                    </button>
                    
                    <button onclick="state.view='reportes'; render()" class="bg-white p-6 md:p-8 rounded-[2.5rem] shadow-sm hover:shadow-xl hover:-translate-y-2 transition-all border border-slate-100 text-center group relative overflow-hidden">
                        <div class="absolute -right-4 -top-4 w-24 h-24 bg-indigo-50 rounded-full opacity-50 group-hover:scale-150 transition-transform duration-500"></div>
                        <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-6 group-hover:bg-indigo-500 group-hover:text-white transition-colors relative z-10 shadow-inner">
                            <i data-lucide="bar-chart-3" class="w-8 h-8"></i>
                        </div>
                        <h3 class="font-black text-slate-900 uppercase tracking-tighter text-lg md:text-xl relative z-10">Reportes</h3>
                        <p class="text-[10px] text-slate-400 font-bold mt-2 uppercase relative z-10">Métricas y PDF</p>
                    </button>
                </div>
                
                <div class="mt-8">
                    <button onclick="state.view='base_datos'; render()" class="w-full bg-slate-900 text-white p-6 md:p-8 rounded-[2.5rem] flex flex-col md:flex-row items-center justify-between hover:bg-black transition-all shadow-xl group">
                        <div class="flex items-center gap-6 mb-4 md:mb-0">
                            <div class="bg-white/10 p-4 rounded-2xl group-hover:bg-white/20 transition-colors">
                                <i data-lucide="database" class="w-8 h-8 text-blue-400"></i>
                            </div>
                            <div class="text-left">
                                <h3 class="font-black uppercase text-xl leading-tight tracking-tight">Base de Datos General</h3>
                                <p class="text-[10px] opacity-60 font-bold uppercase tracking-widest mt-1">Histórico completo de movimientos</p>
                            </div>
                        </div>
                        <div class="flex gap-4">
                            <div class="bg-slate-800 px-6 py-3 rounded-2xl font-black text-xs border border-slate-700 shadow-inner">
                                <span class="text-blue-400">${expandedDB.length}</span> FILAS
                            </div>
                            <div class="bg-slate-800 px-6 py-3 rounded-2xl font-black text-xs border border-slate-700 shadow-inner">
                                <span class="text-amber-400">${pendingCount}</span> PENDIENTES
                            </div>
                        </div>
                    </button>
                </div>
            `;
        }

        // ---------- PREPROGRAMACIÓN ----------
        function renderPreprogramar(content) {
            content.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="lg:col-span-1 bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100 h-fit sticky top-4">
                        <h2 class="text-xl font-black uppercase tracking-tighter mb-6 border-b-2 border-slate-100 pb-4 flex items-center gap-2"><i data-lucide="edit-3" class="w-5 h-5 text-amber-500"></i> Nuevo Pre-Registro</h2>
                        <div class="space-y-5">
                            <div><label class="label-trono">Fecha Estimada</label><input type="date" id="pre_date" class="input-trono bg-slate-50"></div>
                            <div><label class="label-trono">Método de Pago</label><select id="pre_pay" class="input-trono bg-slate-50">${PAYMENTS.map(p => `<option value="${p}">${p}</option>`).join('')}</select></div>
                            <div><label class="label-trono">Nombre del Cliente</label><input type="text" id="pre_client" class="input-trono bg-slate-50" placeholder="Ej. CONSTRUCTORA ABC"></div>
                            <div><label class="label-trono">Teléfono / Contacto</label><input type="text" id="pre_contact" class="input-trono bg-slate-50" placeholder="Ej. 999 123 4567"></div>
                            <div class="flex gap-3 pt-6 border-t border-slate-100">
                                <button onclick="savePre()" class="flex-1 bg-amber-500 text-white px-6 py-4 rounded-2xl font-bold text-xs uppercase tracking-widest hover:bg-amber-600 transition-all shadow-lg shadow-amber-200">Guardar</button>
                                <button onclick="clearPre()" class="btn-secondary px-4"><i data-lucide="eraser" class="w-5 h-5"></i></button>
                            </div>
                        </div>
                    </div>
                    <div class="lg:col-span-2 bg-white rounded-[2.5rem] border border-slate-100 overflow-hidden shadow-sm flex flex-col h-full min-h-[500px]">
                        <div class="p-6 bg-slate-50 border-b border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-4">
                            <h2 class="font-black uppercase tracking-tighter text-lg flex items-center gap-2"><i data-lucide="list" class="w-5 h-5 text-slate-400"></i> Lista de Espera</h2>
                            <div class="relative w-full sm:w-auto">
                                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                                <input type="text" id="pre_search" placeholder="Buscar cliente..." class="input-trono text-xs py-2.5 pl-10 w-full sm:w-64 bg-white" oninput="filterPre()">
                            </div>
                        </div>
                        <div id="pre_list" class="overflow-x-auto flex-1 bg-white"></div>
                    </div>
                </div>
            `;
            filterPre();
        }

        function savePre() {
            const cliente = document.getElementById('pre_client').value.trim();
            const contacto = document.getElementById('pre_contact').value.trim();
            
            const data = {
                id: Date.now(),
                fecha: document.getElementById('pre_date').value || '',
                pago: document.getElementById('pre_pay').value || 'Efectivo',
                cliente: cliente ? cliente.toUpperCase() : '',
                contacto: contacto ? contacto.toUpperCase() : '',
                status: 'PRE'
            };
            state.preprogrammed.push(data);
            saveState();
            clearPre();
            filterPre();
            showToast("PRE-REGISTRO GUARDADO");
        }

        function clearPre() { 
            document.getElementById('pre_date').value = ''; 
            document.getElementById('pre_client').value = ''; 
            document.getElementById('pre_contact').value = ''; 
        }

        function filterPre() {
            const search = document.getElementById('pre_search')?.value.toUpperCase() || '';
            const list = state.preprogrammed.filter(p => 
                (p.cliente && p.cliente.includes(search)) || 
                (p.contacto && p.contacto.includes(search))
            ).sort((a, b) => new Date(a.fecha || 0) - new Date(b.fecha || 0));
            
            const cont = document.getElementById('pre_list');
            if(list.length === 0) { 
                cont.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full p-20 text-slate-300">
                        <i data-lucide="inbox" class="w-16 h-16 mb-4 opacity-50"></i>
                        <div class="font-black uppercase text-sm tracking-widest">Lista vacía</div>
                        <div class="text-[10px] font-bold mt-2">No hay registros pendientes.</div>
                    </div>`; 
                lucide.createIcons();
                return; 
            }
            
            cont.innerHTML = `
                <table class="w-full text-xs">
                    <thead class="bg-slate-50 text-[10px] font-black uppercase text-slate-400 sticky top-0 border-b border-slate-200 shadow-sm">
                        <tr>
                            <th class="p-4 pl-6 text-left whitespace-nowrap">Fecha Est.</th>
                            <th class="p-4 text-left">Cliente / Detalles</th>
                            <th class="p-4 pr-6 text-right">Acción</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                        ${list.map(p => `
                            <tr class="hover:bg-blue-50/50 transition-colors group">
                                <td class="p-4 pl-6">
                                    <div class="font-bold text-slate-700 bg-slate-100 inline-block px-3 py-1 rounded-lg border border-slate-200 whitespace-nowrap">
                                        ${p.fecha ? new Date(p.fecha).toLocaleDateString('es-ES', {timeZone:'UTC'}) : 'SIN FECHA'}
                                    </div>
                                </td>
                                <td class="p-4">
                                    <div class="font-black text-slate-900 text-sm">${p.cliente || 'SIN NOMBRE'}</div>

        function addProdRow(type, pData = null) {

        function toggleExtraDir(btn) {
            const container = btn.closest('.bg-slate-50').querySelector('.extra_dir');

            if(!container.classList.contains('hidden')) {
                btn.classList.add('bg-slate-200', 'border-slate-400');
            } else {
                btn.classList.remove('bg-slate-200', 'border-slate-400');
            }
        }

        function toggleSym(btn) { 
            const act = btn.dataset.active === 'true'; 
            btn.dataset.active = !act;
            if(!act) {
                btn.classList.add('bg-blue-600', 'text-white', 'border-blue-600', 'shadow-md');
                btn.classList.remove('bg-white', 'text-slate-500', 'border-slate-200');

            const isEntrega = type === 'ENTREGAS DE OBRA';

                return showToast("Agrega al menos un producto");
            }
            
            const productos = prodRows.map(row => ({
                cant: parseInt(row.querySelector('.p_cant').value) || 1, 
                modelo: row.querySelector('.p_mod').value, 
                sym: row.querySelector('.p_sym').dataset.active === 'true',
                n_dir: row.querySelector('.p_n_dir').value.toUpperCase(), 
                n_cont: row.querySelector('.p_n_cont').value.toUpperCase(), 
                n_obra: row.querySelector('.p_n_obra')?.value.toUpperCase() || '', 
                n_ubi: row.querySelector('.p_n_ubi').value
            }));

            const entry = {
                id: state.editingId || Date.now(), 
                type,
                fecha: document.getElementById('f_f').value, 
                pago: document.getElementById('f_p').value,
                vendedor: document.getElementById('f_v')?.value || 'N/A', 
                cliente: document.getElementById('f_c').value.toUpperCase(),
                contacto: document.getElementById('f_cont').value.toUpperCase(), 
                cont_contrata: isEntrega ? (document.getElementById('f_cont_contrata')?.value.toUpperCase() || '') : '',
                direccion: document.getElementById('f_dir').value.toUpperCase(),
                ubicacion: document.getElementById('f_ubi').value, 
                cot: document.getElementById('f_cot')?.value || '',
                obra: document.getElementById('f_obra')?.value.toUpperCase() || '', 
                motivo: document.getElementById('f_motivo')?.value || '',
                tipo_mov: document.getElementById('f_mov_t')?.value || '', 
                status: state.editingId ? state.database.find(x=>x.id===state.editingId).status : 'PENDIENTE', 
                updated: new Date().toISOString(),
                productos: productos
            };
            
            if(state.editingId) {
                const prev = state.database.find(x => x.id === state.editingId);
                if(prev.extra_status) entry.extra_status = prev.extra_status;
                if(prev.chk_entrega !== undefined) entry.chk_entrega = prev.chk_entrega;
                if(prev.chk_limpieza !== undefined) entry.chk_limpieza = prev.chk_limpieza;
                if(prev.chk_retiro !== undefined) entry.chk_retiro = prev.chk_retiro;
                
                if(prev.extra_chk_entrega) entry.extra_chk_entrega = prev.extra_chk_entrega;
                if(prev.extra_chk_limpieza) entry.extra_chk_limpieza = prev.extra_chk_limpieza;
                if(prev.extra_chk_retiro) entry.extra_chk_retiro = prev.extra_chk_retiro;
                
                if(prev.folderId !== undefined) entry.folderId = prev.folderId;
                if(prev.extra_folderId !== undefined) entry.extra_folderId = prev.extra_folderId;
            }

            if(isEvent) {
                entry.h_e = document.getElementById('f_h_e').value; 
                entry.h_e_m = document.getElementById('f_h_e_m').value;
                entry.h_r = document.getElementById('f_h_r').value; 
                entry.h_r_m = document.getElementById('f_h_r_m').value;
                entry.f_r = document.getElementById('f_f_r').value;
                entry.limpiezas = Array.from(document.querySelectorAll('#limp_list > div')).map(row => ({ 
                    fecha: row.querySelector('.l_date').value, 
                    hora: row.querySelector('.l_time').value 
                }));
            }

            if(state.editingId) { 
                const idx = state.database.findIndex(x => x.id === state.editingId); 
                state.database[idx] = entry; 
            } else { 
                state.database.push(entry); 
                if(state.convertData) {
                    state.preprogrammed = state.preprogrammed.filter(x => x.id !== state.convertData.id); 
                }
            }
            
            state.editingId = null; 
            state.convertData = null; 
            saveState(); 
            showToast("REGISTRO GUARDADO CON ÉXITO"); 
            state.view = 'base_datos'; 
            render();
        }

        // ---------- NUEVO: GESTION DE CARPETAS Y ARCHIVADO ----------
        function renderFolders() {
            const cont = document.getElementById('folders_container');
            if(!cont) return;

            let bcHTML = `<button onclick="navFolder(null)" class="hover:text-blue-600 transition-colors flex items-center gap-1"><i data-lucide="home" class="w-4 h-4 mb-0.5"></i> INICIO</button>`;
            if(state.currentFolder) {
                let path = [];
                let curr = state.folders.find(f => f.id === state.currentFolder);
                while(curr) {
                    path.unshift(curr);
                    curr = state.folders.find(f => f.id === curr.parentId);
                }
                path.forEach(p => {
                    bcHTML += `<span class="text-slate-300 mx-1">/</span> <button onclick="navFolder('${p.id}')" class="hover:text-blue-600 transition-colors truncate max-w-[100px]">${p.name}</button>`;
                });
            }

            let children = state.folders.filter(f => f.parentId === state.currentFolder);
            children.sort((a,b) => a.name.localeCompare(b.name));

            let foldersHTML = '';
            if(children.length === 0) {
                foldersHTML = `<div class="text-[10px] font-bold text-slate-400 uppercase italic w-full text-center py-4">Carpeta Vacía</div>`;
            } else {
                foldersHTML = children.map(f => `
                    <div class="flex items-center gap-3 p-3 pr-4 bg-slate-50 rounded-xl border border-slate-200 hover:border-blue-300 hover:shadow-md transition-all group cursor-pointer min-w-[150px]">
                        <div onclick="navFolder('${f.id}')" class="flex items-center gap-2 flex-1 overflow-hidden">
                            <i data-lucide="folder" class="w-5 h-5 text-blue-500 fill-blue-100 shrink-0"></i>
                            <span class="text-xs font-black uppercase text-slate-700 truncate">${f.name}</span>
                        </div>
                        <button onclick="showRenameFolderModal('${f.id}')" class="text-slate-300 hover:text-amber-500 opacity-0 group-hover:opacity-100 transition-opacity shrink-0" title="Renombrar"><i data-lucide="edit-2" class="w-3 h-3"></i></button>
                        <button onclick="deleteFolder('${f.id}')" class="text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity shrink-0" title="Eliminar"><i data-lucide="trash" class="w-3 h-3"></i></button>
                    </div>
                `).join('');
            }

            cont.innerHTML = `
                <div class="flex justify-between items-center mb-4 border-b border-slate-100 pb-4">
                    <div class="flex items-center gap-1 text-sm font-black uppercase text-slate-700 overflow-x-auto">
                        ${bcHTML}
                    </div>
                    <button onclick="showNewFolderModal()" class="bg-blue-50 text-blue-600 px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-blue-600 hover:text-white transition-all flex items-center gap-2 shrink-0 shadow-sm"><i data-lucide="folder-plus" class="w-4 h-4"></i> Nueva Carpeta</button>
                </div>
                <div class="flex flex-wrap gap-4">
                    ${foldersHTML}
                </div>
            `;
            lucide.createIcons({root: cont});
        }

        function navFolder(id) {
            state.currentFolder = id;
            state.selectedRows = [];
            renderFolders();
            filterDB();
        }

        function showNewFolderModal() {
            showInputModal("NUEVA CARPETA", "Ingresa el nombre de la carpeta", "", function(name) {
                state.folders.push({ id: 'F'+Date.now(), name: name, parentId: state.currentFolder });
                saveState();
                renderFolders();
                showToast("CARPETA CREADA");
            });
        }

        function showRenameFolderModal(id) {
            const f = state.folders.find(x => x.id === id);
            if(!f) return;
            showInputModal("RENOMBRAR CARPETA", "Modifica el nombre", f.name, function(name) {
                f.name = name;
                saveState();
                renderFolders();
                showToast("CARPETA RENOMBRADA");
            });
        }

        function deleteFolder(id) {
            showConfirm("¿Eliminar carpeta? Los registros dentro volverán a su carpeta principal o al INICIO.", function() {
                state.database.forEach(item => {
                    if(item.folderId === id) delete item.folderId;
                    if(item.extra_folderId) {
                        for(const k in item.extra_folderId) {
                            if(item.extra_folderId[k] === id) delete item.extra_folderId[k];
                        }
                    }
                });
                
                const f = state.folders.find(x=>x.id === id);
                if (state.currentFolder === id) {
                    state.currentFolder = f.parentId;
                }
                state.folders.forEach(child => {
                    if(child.parentId === id) child.parentId = f.parentId;
                });
                state.folders = state.folders.filter(x => x.id !== id);
                saveState();
                renderFolders();
                filterDB();
                showToast("CARPETA ELIMINADA");
            });
        }

        function toggleSelectAll(cb) {
            const rowChks = document.querySelectorAll('.row-chk');
            if (cb.checked) {
                rowChks.forEach(c => {
                    c.checked = true;
                    if(!state.selectedRows.includes(c.value)) state.selectedRows.push(c.value);
                });
            } else {
                rowChks.forEach(c => {
                    c.checked = false;
                    state.selectedRows = state.selectedRows.filter(v => v !== c.value);
                });
            }
            updateMoverButton();
        }

        function toggleRowSelection(cb) {
            if (cb.checked) {
                if(!state.selectedRows.includes(cb.value)) state.selectedRows.push(cb.value);
            } else {
                state.selectedRows = state.selectedRows.filter(v => v !== cb.value);
            }
            const rowChks = document.querySelectorAll('.row-chk');
            let allChecked = rowChks.length > 0;
            rowChks.forEach(c => { if(!c.checked) allChecked = false; });
            const chkAll = document.getElementById('chk_all');
            if(chkAll) chkAll.checked = allChecked;
            updateMoverButton();
        }

        function updateMoverButton() {
            const btn = document.getElementById('btn_mover');
            const count = document.getElementById('sel_count');
            if(btn && count) {
                if(state.selectedRows.length > 0) {
                    btn.classList.remove('hidden');
                    count.innerText = state.selectedRows.length;
                } else {
                    btn.classList.add('hidden');
                }
            }
        }

        function showMoveModal() {
            if(state.selectedRows.length === 0) return;
            
            let opts = `<option value="root">INICIO (Quitar de carpeta)</option>`;
            
            const buildPath = (fId) => {
                let path = [];
                let curr = state.folders.find(f => f.id === fId);
                while(curr) {
                    path.unshift(curr.name);
                    curr = state.folders.find(f => f.id === curr.parentId);
                }
                return path.join(' / ');
            };

            let fList = state.folders.map(f => ({ id: f.id, path: buildPath(f.id) })).sort((a,b) => a.path.localeCompare(b.path));
            fList.forEach(f => {
                opts += `<option value="${f.id}">${f.path}</option>`;
            });

            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[2000] flex items-center justify-center animate-in fade-in duration-200';
            modal.innerHTML = `
                <div class="bg-white p-6 rounded-3xl shadow-2xl max-w-sm w-full mx-4 transform scale-100 animate-in zoom-in-95 duration-200">
                    <h3 class="font-black text-lg text-slate-900 uppercase tracking-tighter mb-2 text-center">Mover Elementos</h3>
                    <p class="text-xs text-slate-500 font-bold mb-4 text-center uppercase">Mover ${state.selectedRows.length} registros a:</p>
                    <select id="modal_move_dest" class="input-trono mb-6">${opts}</select>
                    <div class="flex gap-3">
                        <button id="btn-cancel-mv" class="flex-1 bg-slate-100 text-slate-700 py-3 rounded-xl font-bold text-xs uppercase hover:bg-slate-200 transition-all">Cancelar</button>
                        <button id="btn-confirm-mv" class="flex-1 bg-indigo-600 text-white py-3 rounded-xl font-bold text-xs uppercase hover:bg-indigo-700 transition-all shadow-lg shadow-indigo-200">Mover</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            
            document.getElementById('btn-cancel-mv').onclick = () => modal.remove();
            document.getElementById('btn-confirm-mv').onclick = () => {
                const dest = document.getElementById('modal_move_dest').value;
                const destId = dest === 'root' ? null : dest;
                
                state.selectedRows.forEach(val => {
                    const parts = val.split('|');
                    const id = parseInt(parts[0]);
                    const subDir = decodeURIComponent(parts[1] || '');
                    
                    let item = state.database.find(x => x.id === id);
                    if(item) {
                        if (subDir) {
                            if(!item.extra_folderId) item.extra_folderId = {};
                            if (destId === null) {
                                delete item.extra_folderId[subDir];
                            } else {
                                item.extra_folderId[subDir] = destId;
                            }
                        } else {
                            item.folderId = destId;
                        }
                    }
                });
                
                state.selectedRows = [];
                saveState();
                filterDB();
                modal.remove();
                showToast("REGISTROS MOVIDOS");
            };
        }

        function setStatusFilter(status, btn) {
            state.filters.status = status;
            document.querySelectorAll('.db-tab').forEach(b => {
                b.classList.remove('bg-white', 'shadow', 'text-blue-600');
                b.classList.add('text-slate-500');
            });
            btn.classList.add('bg-white', 'shadow', 'text-blue-600');
            btn.classList.remove('text-slate-500');
            filterDB();
        }

        function filterDB() {
            const search = document.getElementById('db_search')?.value.toUpperCase() || '';
            const date = document.getElementById('db_date')?.value || '';
            const month = document.getElementById('db_month')?.value || '';
            const type = document.getElementById('db_type')?.value || 'TODOS';
            const statusF = state.filters.status;

            let expandedDB = getExpandedDatabase();

            let list = expandedDB.filter(item => {
                let match = true;
                if (search && !(item.cliente||'').includes(search) && !(item.obra||'').toUpperCase().includes(search) && !(item.direccion||'').includes(search)) match = false;
                if (date && item.fecha !== date) match = false;
                
                if (month && item.fecha) {
                    if (item.fecha.split('-')[1] !== month) match = false;
                }

                if (type !== 'TODOS' && item.type !== type) match = false;
                if (statusF === 'PENDIENTES' && (item.status === 'COMPLETADO' || item.status === 'LISTO')) match = false;
                if (statusF === 'COMPLETADOS' && (item.status !== 'COMPLETADO' && item.status !== 'LISTO')) match = false;
                
                if (state.currentFolder === null) {
                    if (item._folderId !== null && item._folderId !== undefined) match = false;
                } else {
                    if (item._folderId !== state.currentFolder) match = false;
                }

                return match;
            });

            list.sort((a, b) => new Date(a.fecha || 0) - new Date(b.fecha || 0));

            const cont = document.getElementById('db_list');
            if (list.length === 0) {
                cont.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full p-20 text-slate-300 w-full absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2">
                        <i data-lucide="search-x" class="w-16 h-16 mb-4 opacity-50"></i>
                        <div class="font-black uppercase text-sm tracking-widest">Sin resultados</div>
                        <div class="text-[10px] font-bold mt-2">Prueba cambiando los filtros.</div>
                    </div>`;
                lucide.createIcons();
                
                const chkAllNode = document.getElementById('chk_all');
                if (chkAllNode) chkAllNode.checked = false;
                
                updateMoverButton();
                return;
            }

            let tableHTML = `
                <table class="w-full text-xs min-w-[1050px]">
                    <thead class="bg-white text-[9px] font-black uppercase text-slate-400 sticky top-0 border-b-2 border-slate-100 z-10 shadow-sm">
                        <tr>
                            <th class="p-4 pl-6 text-center w-12 border-r border-slate-100">
                                <input type="checkbox" id="chk_all" class="w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500 cursor-pointer" onclick="toggleSelectAll(this)">
                            </th>
                            <th class="p-4 pl-4 text-left w-24">Estado</th>
                            <th class="p-4 text-left w-28">Fecha/Tipo</th>
                            <th class="p-4 text-left w-64">Cliente / Obra</th>
                            <th class="p-4 text-left w-64">Dirección</th>
                            <th class="p-4 text-center">Unids.</th>
                            <th class="p-4 pr-6 text-right w-32">Acciones</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
            `;

            list.forEach(item => {
                const isComp = item.status === 'COMPLETADO' || item.status === 'LISTO';
                const totalUnits = item.productos ? item.productos.reduce((sum, p) => sum + parseInt(p.cant||0), 0) : 0;
                
                let typeColor = 'slate';
                let typeIcon = 'box';
                if(item.type === 'EVENTO') { typeColor = 'blue'; typeIcon = 'star'; }
                if(item.type === 'ENTREGAS DE OBRA') { typeColor = 'emerald'; typeIcon = 'truck'; }
                if(item.type === 'RETIROS DE OBRA') { typeColor = 'red'; typeIcon = 'package-minus'; }
                if(item.type === 'MOVIMIENTO') { typeColor = 'indigo'; typeIcon = 'refresh-cw'; }

                let subDirEnc = item._subDir ? encodeURIComponent(item._subDir).replace(/'/g, "%27") : '';
                let subDirArgHito = item._isSub ? `, decodeURIComponent('${subDirEnc}')` : `, ''`;
                let subDirArgStatus = item._isSub ? `, decodeURIComponent('${subDirEnc}')` : `, ''`;
                
                let checkboxValue = `${item.id}|${subDirEnc}`;
                let isChecked = state.selectedRows.includes(checkboxValue);

                let checkHTML = '';
                if (isComp) {
                    checkHTML = `<input type="checkbox" class="row-chk w-4 h-4 text-blue-600 rounded border-slate-300 cursor-pointer" value="${checkboxValue}" ${isChecked ? 'checked' : ''} onchange="toggleRowSelection(this)">`;
                } else {
                    checkHTML = `<div class="w-4 h-4 mx-auto rounded border border-slate-200 bg-slate-100 opacity-40 cursor-not-allowed" title="Debe estar Completado para poder moverlo"></div>`;
                }

                let statusColHTML = '';
                if (item.type === 'EVENTO') {
                    let origItem = item._ref;
                    let cEnt = item._isSub ? (origItem.extra_chk_entrega && origItem.extra_chk_entrega[item._subDir]) : origItem.chk_entrega;
                    let cLim = item._isSub ? (origItem.extra_chk_limpieza && origItem.extra_chk_limpieza[item._subDir]) : origItem.chk_limpieza;
                    let cRet = item._isSub ? (origItem.extra_chk_retiro && origItem.extra_chk_retiro[item._subDir]) : origItem.chk_retiro;
                    
                    cEnt = cEnt || false;
                    cLim = cLim || false;
                    cRet = cRet || false;

                    if (isComp && cEnt === false && cLim === false && cRet === false) {
                        cEnt = true; cLim = true; cRet = true;
                    }

                    statusColHTML = `
                        <div class="flex flex-col gap-1.5 w-full">
                            <button onclick="toggleHito(${item.id}, 'chk_entrega'${subDirArgHito})" class="w-full flex items-center justify-between px-2 py-1.5 rounded-lg border transition-all ${cEnt ? 'bg-blue-50 border-blue-400 text-blue-600 shadow-inner' : 'bg-white border-slate-200 text-slate-400 hover:border-blue-300'}" title="Confirmar Entrega">
                                <span class="text-[9px] font-black uppercase">Entr.</span>
                                <i data-lucide="${cEnt ? 'check-square' : 'square'}" class="w-3 h-3"></i>
                            </button>
                            <button onclick="toggleHito(${item.id}, 'chk_limpieza'${subDirArgHito})" class="w-full flex items-center justify-between px-2 py-1.5 rounded-lg border transition-all ${cLim ? 'bg-cyan-50 border-cyan-400 text-cyan-600 shadow-inner' : 'bg-white border-slate-200 text-slate-400 hover:border-cyan-300'}" title="Confirmar Limpieza">
                                <span class="text-[9px] font-black uppercase">Limp.</span>

        function toggleStatus(id, subDir = '') {
            const item = state.database.find(x => x.id === id);
            if(item) {
                if (subDir) {
                    if (!item.extra_status) item.extra_status = {};
                    item.extra_status[subDir] = item.extra_status[subDir] === 'COMPLETADO' ? 'PENDIENTE' : 'COMPLETADO';
                    if (item.extra_status[subDir] !== 'COMPLETADO') {
                        let subDirEnc = encodeURIComponent(subDir).replace(/'/g, "%27");
                        state.selectedRows = state.selectedRows.filter(v => v !== `${id}|${subDirEnc}`);
                    }
                } else {
                    item.status = item.status === 'COMPLETADO' ? 'PENDIENTE' : 'COMPLETADO';
                    if (item.status !== 'COMPLETADO') {
                        state.selectedRows = state.selectedRows.filter(v => v !== `${id}|`);
                    }
                }
                saveState();
                if (state.view === 'base_datos') filterDB();
                if (state.view === 'reportes') updateDash();
            }
        }

        function toggleHito(id, hito, subDir = '') {
            const item = state.database.find(x => x.id === id);
            if(item) {
                if (subDir) {
                    let extraHitoKey = 'extra_' + hito; 
                    if (!item[extraHitoKey]) item[extraHitoKey] = {};
                    
                    if (item.extra_status && item.extra_status[subDir] === 'COMPLETADO' && item[extraHitoKey][subDir] === undefined) {
                        if (!item.extra_chk_entrega) item.extra_chk_entrega = {};
                        if (!item.extra_chk_limpieza) item.extra_chk_limpieza = {};
                        if (!item.extra_chk_retiro) item.extra_chk_retiro = {};
                        item.extra_chk_entrega[subDir] = true;
                        item.extra_chk_limpieza[subDir] = true;
                        item.extra_chk_retiro[subDir] = true;
                    }
                    
                    if (item[extraHitoKey][subDir] === undefined) item[extraHitoKey][subDir] = false;
                    item[extraHitoKey][subDir] = !item[extraHitoKey][subDir];
                    
                    if (!item.extra_status) item.extra_status = {};
                    let isEnt = item.extra_chk_entrega && item.extra_chk_entrega[subDir];
                    let isLim = item.extra_chk_limpieza && item.extra_chk_limpieza[subDir];
                    let isRet = item.extra_chk_retiro && item.extra_chk_retiro[subDir];
                    
                    if (isEnt && isLim && isRet) {
                        item.extra_status[subDir] = 'COMPLETADO';
                        showToast("EVENTO ADICIONAL COMPLETADO");
                    } else {
                        item.extra_status[subDir] = 'PENDIENTE';
                        let subDirEnc = encodeURIComponent(subDir).replace(/'/g, "%27");
                        state.selectedRows = state.selectedRows.filter(v => v !== `${id}|${subDirEnc}`);
                    }
                } else {
                    if (item.status === 'COMPLETADO' && item.chk_entrega === undefined) {
                        item.chk_entrega = true; item.chk_limpieza = true; item.chk_retiro = true;
                    }
                    if (item[hito] === undefined) item[hito] = false;
                    item[hito] = !item[hito];
                    
                    if (item.chk_entrega && item.chk_limpieza && item.chk_retiro) {
                        item.status = 'COMPLETADO';
                        showToast("EVENTO COMPLETADO");
                    } else {
                        item.status = 'PENDIENTE';
                        state.selectedRows = state.selectedRows.filter(v => v !== `${id}|`);
                    }
                }
                saveState();
                if (state.view === 'base_datos') filterDB();
                if (state.view === 'reportes') updateDash();
            }
        }

        function editEntry(id) { state.editingId = id; state.view = 'programar'; render(); }
        
        function deleteEntry(id, isSub = false, subDirEnc = '') {
            const msg = isSub 
                ? "¿Estás seguro de eliminar PERMANENTEMENTE esta ubicación adicional?" 
                : "¿Estás seguro de eliminar PERMANENTEMENTE el registro principal? (Los adicionales se mantendrán intactos si existen).";
                
            showConfirm(msg + " Esta acción no se puede deshacer.", function() {
                const itemIndex = state.database.findIndex(x => x.id === id);
                if (itemIndex === -1) return;
                
                let item = state.database[itemIndex];
                
                if (isSub) {
                    const subDir = decodeURIComponent(subDirEnc);
                    item.productos = item.productos.filter(p => p.n_dir !== subDir);
                    if (item.extra_status) delete item.extra_status[subDir];
                    if (item.extra_chk_entrega) delete item.extra_chk_entrega[subDir];
                    if (item.extra_chk_limpieza) delete item.extra_chk_limpieza[subDir];
                    if (item.extra_chk_retiro) delete item.extra_chk_retiro[subDir];
                } else {
                    item.productos = item.productos.filter(p => !!p.n_dir);
                }
                
                if (!item.productos || item.productos.length === 0) {
                    state.database.splice(itemIndex, 1);
                }
                
                saveState();
                filterDB();
                showToast("Registro Eliminado");
            });
        }

        // ---------- LOGÍSTICA DIARIA Y PDF ----------
        
        function getFilteredItemLogistics(item, statusFilter) {
            if (statusFilter === 'TODOS') return item;

            const isMainComp = item.status === 'COMPLETADO' || item.status === 'LISTO';

            if (!item.productos || item.productos.length === 0) {
                if (statusFilter === 'PENDIENTES' && isMainComp) return null;
                if (statusFilter === 'COMPLETADOS' && !isMainComp) return null;
                return item;
            }

            let mainProds = [];
            let extraProds = [];
            
            item.productos.forEach(p => {
                if (p.n_dir) {
                    let dirStat = (item.extra_status && item.extra_status[p.n_dir]) || 'PENDIENTE';
                    let isDirComp = dirStat === 'COMPLETADO' || dirStat === 'LISTO';
                    
                    if (statusFilter === 'PENDIENTES' && !isDirComp) extraProds.push(p);
                    if (statusFilter === 'COMPLETADOS' && isDirComp) extraProds.push(p);
                } else {
                    if (statusFilter === 'PENDIENTES' && !isMainComp) mainProds.push(p);
                    if (statusFilter === 'COMPLETADOS' && isMainComp) mainProds.push(p);
                }
            });

            if (mainProds.length === 0 && extraProds.length === 0) return null;

            return { ...item, productos: [...mainProds, ...extraProds] };
        }

        function setRouteStatus(status, btn) {
            state.routeStatus = status;
            document.querySelectorAll('.route-tab').forEach(b => {
                b.classList.remove('bg-white', 'shadow', 'text-emerald-600');
                b.classList.add('text-slate-500');

            btn.classList.add('bg-white', 'shadow', 'text-emerald-600');
            btn.classList.remove('text-slate-500');

        function generateRoute() {
            const targetDate = document.getElementById('route_date').value;
            if(!targetDate) return;
            const statusFilter = state.routeStatus || 'PENDIENTES';
            const cont = document.getElementById('route_content');
            
            const groups = { 'EVENTOS': [], 'ENTREGAS': [], 'RETIROS': [], 'MOVIMIENTOS': [] };
            let expandedDB = getExpandedDatabase();

            expandedDB.forEach(item => {
                if (item.type === 'EVENTO') {
                    let isEntComp = item.chk_entrega || false;
                    let showEnt = (statusFilter === 'TODOS') || (statusFilter === 'PENDIENTES' && !isEntComp) || (statusFilter === 'COMPLETADOS' && isEntComp);

                    if (item.fecha === targetDate && showEnt) {
                        groups['EVENTOS'].push({ ...item, _routeType: 'ENTREGA DE EVENTO', _actionCompleted: isEntComp });
                    }

                    let isRetComp = item.chk_retiro || false;
                    let showRet = (statusFilter === 'TODOS') || (statusFilter === 'PENDIENTES' && !isRetComp) || (statusFilter === 'COMPLETADOS' && isRetComp);
                    
                    if (item.f_r === targetDate && showRet) {
                        groups['RETIROS'].push({ ...item, _routeType: 'RETIRO DE EVENTO', _routeTime: item.h_r, _routeTimeMax: item.h_r_m, _actionCompleted: isRetComp });
                    }

                    let isLimComp = item.chk_limpieza || false;
                    let showLim = (statusFilter === 'TODOS') || (statusFilter === 'PENDIENTES' && !isLimComp) || (statusFilter === 'COMPLETADOS' && isLimComp);

                    if (item._ref.limpiezas && showLim) {
                        item._ref.limpiezas.forEach(l => {
                            if(l.fecha === targetDate) {
                                groups['MOVIMIENTOS'].push({ ...item, _routeType: 'LIMPIEZA DE EVENTO', _routeTime: l.hora, _actionCompleted: isLimComp });
                            }
                        });
                    }
                } else {
                    let isComp = item.status === 'COMPLETADO' || item.status === 'LISTO';
                    if (statusFilter === 'PENDIENTES' && isComp) return;
                    if (statusFilter === 'COMPLETADOS' && !isComp) return;

                    if(item.fecha === targetDate) {
                        if(item.type === 'ENTREGAS DE OBRA') groups['ENTREGAS'].push({ ...item, _routeType: 'ENTREGA DE OBRA' });
                        else if(item.type === 'RETIROS DE OBRA') groups['RETIROS'].push({ ...item, _routeType: 'RETIRO DE OBRA' });
                        else if(item.type === 'MOVIMIENTO') groups['MOVIMIENTOS'].push({ ...item, _routeType: 'MOVIMIENTO' });
                    }
                }
            });

            groups['EVENTOS'].sort((a, b) => (a.h_e || '23:59').localeCompare(b.h_e || '23:59'));
            groups['ENTREGAS'].sort((a, b) => (a.obra || 'ZZZ').localeCompare(b.obra || 'ZZZ'));

            let totalActs = groups['EVENTOS'].length + groups['ENTREGAS'].length + groups['RETIROS'].length + groups['MOVIMIENTOS'].length;

                        <p class="text-xs text-slate-400 mt-2 font-bold">No hay servicios programados para los filtros seleccionados.</p>
                    </div>`;
                lucide.createIcons({root: cont});
                return;
            }

            let html = `

                            ${item.ubicacion ? `<a href="${item.ubicacion}" target="_blank" class="text-[9px] font-black uppercase text-blue-600 bg-blue-50 px-2 py-1 rounded inline-block w-full break-all mb-2 hover:bg-blue-100 transition-colors input-lowercase" style="text-transform: none;"><i data-lucide="link" class="w-3 h-3 inline"></i> ${item.ubicacion}</a>` : ''}
                            <div class="flex flex-wrap gap-2">

                                    return `<span class="bg-white border border-slate-200 shadow-sm text-[10px] font-black uppercase px-2 py-1 rounded-lg text-slate-700 items-center">${p.cant}x ${p.modelo}${symHtml}</span>`;

                    `;

                    let col4 = '';
                    if(item._routeType === 'ENTREGA DE EVENTO') {
